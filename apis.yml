name: Function of Beauty
description: >-
  Function of Beauty is a direct-to-consumer beauty and personal-care brand built
  around personalization, best known for quiz-driven customizable hair care
  (shampoo and conditioner) and skin and body products formulated to an individual
  profile. The company sells online through a Shopify-hosted storefront. Its
  customer-facing programmatic surface is therefore the Shopify commerce platform:
  a live hosted Storefront MCP server at /api/mcp (product search, cart, policies,
  product details) and the Shopify Customer Account API exposed through OpenID
  Connect discovery on the company domain. Function of Beauty was added to the API
  Evangelist network as a GGV Capital portfolio company and enriched from its
  public discovery surface.
